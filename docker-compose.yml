services:
  postgres:
    image: postgres:16-alpine
    container_name: otus-cinema-db
    environment:
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema
      POSTGRES_DB: cinema_db
    ports:
      - "5433:5432"
    volumes:
      - cinema_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema -d cinema_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cinema_pgdata:
